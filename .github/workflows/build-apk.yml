name: 构建漫剧 TV 自用版 APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      publish:
        description: '打包后发布 Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mangju-tv-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 准备 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 准备 Gradle 8.14.3（镜像直连，绕开 GitHub Releases 504）
        shell: bash
        run: |
          set -e
          # services.gradle.org / downloads.gradle.org 都 307 跳到
          # github.com/gradle/gradle-distributions/releases，该通道当前稳定 504。
          # 直接用不跳转的镜像下载发行包并解压，避免改 wrapper 的官方域名校验。
          GRADLE_ZIP="$RUNNER_TEMP/gradle-8.14.3-bin.zip"
          for MIRROR in \
            "https://mirrors.cloud.tencent.com/gradle/gradle-8.14.3-bin.zip" \
            "https://mirrors.huaweicloud.com/gradle/gradle-8.14.3-bin.zip" \
            "https://repo.huaweicloud.com/gradle/gradle-8.14.3-bin.zip" \
            "https://services.gradle.org/distributions/gradle-8.14.3-bin.zip"; do
            echo "尝试镜像: $MIRROR"
            if curl -fsSL --connect-timeout 15 --max-time 300 -o "$GRADLE_ZIP" "$MIRROR"; then
              echo "下载成功: $MIRROR"
              break
            fi
            echo "该源失败，换下一个"
          done
          [ -s "$GRADLE_ZIP" ] || { echo "所有 Gradle 下载源均失败"; exit 1; }
          unzip -q -o "$GRADLE_ZIP" -d "$RUNNER_TEMP/gradle-dist"
          GRADLE_BIN="$RUNNER_TEMP/gradle-dist/gradle-8.14.3/bin/gradle"
          chmod +x "$GRADLE_BIN"
          "$GRADLE_BIN" --version | head -8
          echo "GRADLE_BIN=$GRADLE_BIN" >> "$GITHUB_ENV"

      - name: 安装 Android SDK Platform 36 / Build Tools 36
        shell: bash
        run: |
          set -e
          SDKMGR="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager)"
          fi
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          "$SDKMGR" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "已安装："
          ls -1 "$ANDROID_HOME/platforms" | grep 'android-36' || true

      - name: 注入 release 签名（仅当配置了 Secrets）
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > ours.jks
            {
              # app/build.gradle.kts 用 app 模块的 file() 解析 storeFile，
              # 因此这里要写回仓库根目录的 jks（../ours.jks）
              echo "storeFile=../ours.jks"
              echo "storePassword=$KS_STORE_PASS"
              echo "keyAlias=$KS_KEY_ALIAS"
              echo "keyPassword=$KS_KEY_PASS"
            } > keystore.properties
            echo "release 签名已注入，本次将产出 release 包"
          else
            echo "::notice::未配置 KEYSTORE_BASE64 等 Secrets，本次只产出 debug 包（可直接安装）"
          fi

      - name: 编译 APK
        shell: bash
        run: |
          set -e
          run_build() {
            "$GRADLE_BIN" assembleDebug --no-daemon --console=plain --stacktrace
            if [ -f keystore.properties ]; then
              "$GRADLE_BIN" assembleRelease --no-daemon --console=plain --stacktrace
            fi
          }
          # Kotlin 2.1.20 的 compiler embeddable 也走 GitHub Releases，偶发 504；
          # 首次失败时依赖多半已落盘，重试一次通常即可通过。
          if ! run_build; then
            echo "::warning::首次构建失败，20 秒后重试一次"
            sleep 20
            run_build
          fi
          echo "==== 产物清单 ===="
          find app/build/outputs/apk -name '*.apk' -printf '%p  %s bytes\n'

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: mangju-tv-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        if: ${{ inputs.publish == true || startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="v1.0.${{ github.run_number }}"
          mkdir -p dist
          found=0
          while IFS= read -r f; do
            found=1
            base="$(basename "$f")"
            cp "$f" "dist/mangju-tv-$TAG-${base#app-}"
          done < <(find app/build/outputs/apk -name '*.apk' | sort)
          [ "$found" -eq 1 ] || { echo "没有 APK 产物"; exit 1; }
          ls -la dist
          gh release create "$TAG" dist/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --title "漫剧 TV 自用版 $TAG" \
            --notes "自用分支自动构建。基于 tsukiyo-zero/hongguoTV（GPL-3.0-only）修改，完整对应源码即本仓库本次提交，LICENSE / NOTICE.md 随源码提供。非红果官方客户端，与内容平台无隶属关系。若配置了签名 Secrets，会同时提供 release 与 debug 包；否则只有 debug 包。"
          echo "已发布 Release：$TAG"
